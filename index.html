<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>#29 Dated Forever</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    font-family:'Poppins',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#e6c67a;
    text-align:center;
    background:
        radial-gradient(circle at 50% 20%, #2b0000 0%, #000 60%);
}

/* Moon */
.moon{
    position:absolute;
    top:8%;
    right:10%;
    width:140px;
    height:140px;
    border-radius:50%;
    background:
        radial-gradient(circle at 35% 35%, #fff 0%, #f8e7b5 40%, #d6b76b 60%, #b8964f 100%);
    box-shadow:
        0 0 40px rgba(255,215,0,0.6),
        0 0 120px rgba(255,215,0,0.3),
        0 0 200px rgba(255,0,0,0.15);
    animation:moonGlow 4s ease-in-out infinite alternate;
}

.moon::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    background:
        radial-gradient(circle at 60% 60%, rgba(0,0,0,0.15) 0%, transparent 40%),
        radial-gradient(circle at 30% 70%, rgba(0,0,0,0.1) 0%, transparent 35%);
}

@keyframes moonGlow{
    from{transform:scale(1)}
    to{transform:scale(1.03)}
}

/* Floating Screenshots */
.floating{
    position:absolute;
    width:170px;
    opacity:0.35;
    animation:float 22s infinite linear;
    border-radius:15px;
    box-shadow:0 0 20px rgba(255,215,0,0.2);
}

@keyframes float{
    0%{transform:translateY(100vh) scale(1);opacity:0}
    20%{opacity:0.4}
    80%{opacity:0.4}
    100%{transform:translateY(-120vh) scale(1.1);opacity:0}
}

/* Page Styling */
.page{
    position:absolute;
    width:90%;
    max-width:800px;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    transition:1s ease;
}

.page.active{
    display:flex;
}

/* Headings */
h1{
    font-family:'Cinzel',serif;
    font-size:clamp(2rem,4vw,3rem);
    background:linear-gradient(to right,#f5d98b,#caa64f,#f5d98b);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow:0 0 25px rgba(255,215,0,0.4);
    margin:20px;
}

/* Paragraph */
p{
    color:#d9b85f;
    font-size:1.1rem;
}

/* Buttons */
button{
    padding:14px 35px;
    margin:12px;
    border:none;
    border-radius:40px;
    font-size:1rem;
    cursor:pointer;
    background:linear-gradient(45deg,#5a0000,#a00000);
    color:white;
    box-shadow:0 0 20px rgba(255,0,0,0.4);
    transition:0.4s;
}

button:hover{
    transform:scale(1.07);
    box-shadow:0 0 40px rgba(255,0,0,0.8);
}

/* Main Screenshot */
.main-img{
    width:300px;
    border-radius:20px;
    margin-top:20px;
    box-shadow:0 0 35px rgba(255,215,0,0.5);
}

/* Final Quote */
.quote{
    font-family:'Cinzel',serif;
    font-size:28px;
    margin-top:30px;
    background:linear-gradient(to right,#f5d98b,#caa64f,#f5d98b);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}
</style>
</head>

<body>

<div class="moon"></div>

<!-- Floating Screenshots -->
<img src="ss1.jpeg" class="floating" style="left:5%; animation-delay:0s;">
<img src="ss2.jpeg" class="floating" style="left:20%; animation-delay:3s;">
<img src="ss3.jpeg" class="floating" style="left:35%; animation-delay:6s;">
<img src="ss4.jpeg" class="floating" style="left:50%; animation-delay:9s;">
<img src="ss5.jpeg" class="floating" style="left:65%; animation-delay:12s;">
<img src="ss6.jpeg" class="floating" style="left:80%; animation-delay:15s;">
<img src="ss7.jpeg" class="floating" style="left:10%; animation-delay:18s;">

<!-- Page 1 -->
<div class="page active" id="page1">
    <h1>Pragyaa 🐒 ... sorry be 😢</h1>
    <p>Maaf kr de yr</p>
    <button onclick="goTo(3)">Maaf Kiya ❤️</button>
    <button onclick="goTo(2)">Ni Karenge 😒</button>
</div>

<!-- Page 2 -->
<div class="page" id="page2">
    <h1>Sorry bola na 😢</h1>
    <button onclick="goTo(3)">Chal Maaf Kiya ❤️</button>
</div>

<!-- Page 3 -->
<div class="page" id="page3">
    <h1>Accha Pragya... u know iss baar February me 29th hai hi nahi 😢</h1>
    <button onclick="goTo(4)">Aisa kyu puch rhe?</button>
</div>

<!-- Page 4 -->
<div class="page" id="page4">
    <h1>Bcz I met someone very special on 29th ❤️</h1>
    <button onclick="goTo(5)">Continue ✨</button>
</div>

<!-- Page 5 -->
<div class="page" id="page5">
    <h1>It all started here ❤️</h1>
    <img src="main.jpeg" class="main-img">
    <div class="quote">#29 Dated Forever ❤️</div>
</div>

<script>
function goTo(pageNumber){
    let pages=document.querySelectorAll('.page');
    pages.forEach(page=>page.classList.remove('active'));
    document.getElementById('page'+pageNumber).classList.add('active');
}
</script>

</body>
</html>
