<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Month 🌙</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Poppins:wght@300;400&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    font-family:'Poppins',sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#e6c67a;
    background:
        radial-gradient(circle at 50% 20%, #2b0000 0%, #000 60%);
}

/* Moon */
.moon{
    position:absolute;
    top:8%;
    right:10%;
    width:140px;
    height:140px;
    border-radius:50%;
    background:
        radial-gradient(circle at 35% 35%, #fff 0%, #f8e7b5 40%, #d6b76b 60%, #b8964f 100%);
    box-shadow:
        0 0 40px rgba(255,215,0,0.6),
        0 0 120px rgba(255,215,0,0.3),
        0 0 200px rgba(255,0,0,0.15);
    animation:moonGlow 4s ease-in-out infinite alternate;
}

/* Moon subtle craters */
.moon::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    background:
        radial-gradient(circle at 60% 60%, rgba(0,0,0,0.15) 0%, transparent 40%),
        radial-gradient(circle at 30% 70%, rgba(0,0,0,0.1) 0%, transparent 35%);
}

/* Glow animation */
@keyframes moonGlow{
    from{transform:scale(1)}
    to{transform:scale(1.03)}
}

/* Stars */
.star{
    position:absolute;
    width:2px;
    height:2px;
    background:gold;
    border-radius:50%;
    animation:twinkle 3s infinite alternate;
}

@keyframes twinkle{
    from{opacity:0.3}
    to{opacity:1}
}

/* Floating golden particles */
.particle{
    position:absolute;
    width:3px;
    height:3px;
    background:gold;
    border-radius:50%;
    opacity:0;
    animation:float linear infinite;
}

@keyframes float{
    0%{transform:translateY(100vh);opacity:0}
    20%{opacity:.8}
    80%{opacity:.6}
    100%{transform:translateY(-10vh);opacity:0}
}

/* Page styling */
.page{
    position:absolute;
    width:90%;
    max-width:800px;
    text-align:center;
    transition:1.2s ease;
}

.hidden{
    opacity:0;
    transform:translateY(40px);
    pointer-events:none;
}

.active{
    opacity:1;
    transform:translateY(0);
}

.title{
    font-family:'Cinzel',serif;
    font-size:clamp(2.2rem,5vw,3.5rem);
    background:linear-gradient(to right,#f5d98b,#caa64f,#f5d98b);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    text-shadow:0 0 25px rgba(255,215,0,0.4);
    margin-bottom:20px;
}

.subtitle{
    font-size:1.1rem;
    color:#d9b85f;
    margin-bottom:15px;
}

.btn{
    margin-top:30px;
    padding:14px 40px;
    border-radius:50px;
    border:none;
    background:linear-gradient(45deg,#5a0000,#a00000);
    color:white;
    font-size:1rem;
    cursor:pointer;
    transition:0.5s;
    box-shadow:0 0 20px rgba(255,0,0,0.4);
}

.btn:hover{
    transform:scale(1.07);
    box-shadow:0 0 40px rgba(255,0,0,0.8);
}

video{
    width:100%;
    margin-top:30px;
    border-radius:15px;
    box-shadow:0 0 40px rgba(255,215,0,0.4);
}
</style>
</head>

<body>

<div class="moon"></div>

<!-- PAGE 1 -->
<div id="page1" class="page active">
    <h1 class="title">Pragya… 🌙</h1>
    <p class="subtitle">
        There was no 29th February this year…
    </p>
    <p class="subtitle">
        Then why does 29th still feel magical?
    </p>
    <button class="btn" onclick="next(1,2)">Tell Me</button>
</div>

<!-- PAGE 2 -->
<div id="page2" class="page hidden">
    <h1 class="title">Why 29th?</h1>
    <p class="subtitle">
        Out of all the days…  
        why does this one glow brighter than the moon?
    </p>
    <button class="btn" onclick="next(2,3)">I Want To Know</button>
</div>

<!-- PAGE 3 -->
<div id="page3" class="page hidden">
    <h1 class="title">
        Because I met someone very special on 29th 💖
    </h1>

    <video id="video" controls>
        <source src="yourvideo.mp4" type="video/mp4">
    </video>

    <p class="subtitle" style="margin-top:20px;">
        And tomorrow completes one beautiful month ✨
    </p>
</div>

<script>
function next(current,nextPage){
    document.getElementById("page"+current).classList.replace("active","hidden");
    const nextEl=document.getElementById("page"+nextPage);
    nextEl.classList.replace("hidden","active");

    if(nextPage===3){
        document.getElementById("video").play().catch(()=>{});
    }
}

/* Generate stars */
for(let i=0;i<80;i++){
    const s=document.createElement("div");
    s.className="star";
    s.style.left=Math.random()*100+"%";
    s.style.top=Math.random()*60+"%";
    s.style.animationDelay=Math.random()*3+"s";
    document.body.appendChild(s);
}

/* Generate floating particles */
for(let i=0;i<40;i++){
    const p=document.createElement("div");
    p.className="particle";
    p.style.left=Math.random()*100+"%";
    p.style.animationDuration=12+Math.random()*10+"s";
    p.style.animationDelay=Math.random()*10+"s";
    document.body.appendChild(p);
}
</script>

</body>
</html>
