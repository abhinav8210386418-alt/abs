<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>#29 Dated Forever</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: 'Georgia', serif;
    color: gold;
    text-align: center;
    background:
        radial-gradient(circle at 70% 20%, rgba(255,255,200,0.15), transparent 40%),
        linear-gradient(to bottom, #000000, #1a0000, #000000);
}

/* Floating Screenshots */
.floating {
    position: absolute;
    width: 180px;
    opacity: 0.4;
    animation: float 20s infinite linear;
    border-radius: 15px;
}

@keyframes float {
    0% { transform: translateY(100vh) scale(1); opacity:0; }
    50% { opacity:0.5; }
    100% { transform: translateY(-120vh) scale(1.1); opacity:0; }
}

/* Page Styling */
.page {
    position: absolute;
    width: 100%;
    height: 100%;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

.page.active {
    display: flex;
}

h1 {
    font-size: 38px;
    background: linear-gradient(45deg, gold, red, gold);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin: 20px;
}

button {
    padding: 12px 25px;
    margin: 10px;
    border: none;
    border-radius: 30px;
    font-size: 16px;
    cursor: pointer;
    background: linear-gradient(45deg, red, gold);
    color: black;
    font-weight: bold;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.1);
}

.main-img {
    width: 300px;
    border-radius: 20px;
    margin-top: 20px;
    box-shadow: 0 0 25px gold;
}

.quote {
    font-size: 28px;
    margin-top: 30px;
    background: linear-gradient(45deg, red, gold);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
</style>
</head>

<body>

<!-- Floating Screenshots -->
<img src="ss1.jpg" class="floating" style="left:5%; animation-delay:0s;">
<img src="ss2.jpg" class="floating" style="left:20%; animation-delay:3s;">
<img src="ss3.jpg" class="floating" style="left:35%; animation-delay:6s;">
<img src="ss4.jpg" class="floating" style="left:50%; animation-delay:9s;">
<img src="ss5.jpg" class="floating" style="left:65%; animation-delay:12s;">
<img src="ss6.jpg" class="floating" style="left:80%; animation-delay:15s;">
<img src="ss7.jpg" class="floating" style="left:10%; animation-delay:18s;">
<img src="ss8.jpg" class="floating" style="left:70%; animation-delay:21s;">

<!-- Page 1 -->
<div class="page active" id="page1">
    <h1>Pragyaa 🐒 ... sorry be 😢</h1>
    <p>Maaf kr de yr</p>
    <button onclick="goTo(3)">Maaf Kiya ❤️</button>
    <button onclick="goTo(2)">Ni Karenge 😒</button>
</div>

<!-- Page 2 -->
<div class="page" id="page2">
    <h1>Sorry bola na 😢</h1>
    <button onclick="goTo(3)">Chal Maaf Kiya ❤️</button>
</div>

<!-- Page 3 -->
<div class="page" id="page3">
    <h1>Accha Pragya... u know iss baar February me 29th hai hi nahi 😢</h1>
    <button onclick="goTo(4)">Aisa kyu puch rhe?</button>
</div>

<!-- Page 4 -->
<div class="page" id="page4">
    <h1>Bcz I met someone very special on 29th ❤️</h1>
    <button onclick="goTo(5)">Continue ✨</button>
</div>

<!-- Page 5 -->
<div class="page" id="page5">
    <h1>It all started here ❤️</h1>
    <img src="main.jpg" class="main-img">
    <div class="quote">#29 Dated Forever ❤️</div>
</div>

<script>
function goTo(pageNumber) {
    let pages = document.querySelectorAll('.page');
    pages.forEach(page => page.classList.remove('active'));
    document.getElementById('page' + pageNumber).classList.add('active');
}
</script>

</body>
</html>
